[project]
name = "unn-2026-goriacheva-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
packages = ["bot"]